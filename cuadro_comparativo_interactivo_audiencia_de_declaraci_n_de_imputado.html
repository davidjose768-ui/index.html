<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Data Source for Comparison
        const COMPARISON_DATA = [
            {
                id: 'tipo_audiencia',
                criterion: '1. Tipo de Audiencia',

                menosGrave: {

            {

                criterion: '2. Tipo de Medida Cautelar',

                grave: {

                },
                menosGrave: {
                    summary: 'Medidas Cautelares Sustitutivas de la Prisión Preventiva (No Privativas de Libertad)',

                }
            },
            {
                id: 'organo_judicial',
                criterion: '3. Órgano Judicial Competente',
                icon: 'fa-building-columns',

                    description: 'Juez de Letras de lo Penal de la circunscripción correspondiente o Juzgados de Letras con Competencia Territorial Nacional en Materia Penal / Extorsión / Criminalidad Organizada.',
                    details: 'Atendido por jueces de carrera especializada para el control de garantías e instrucción formal del proceso ordinario.',
                    articles: 'Arts. 54, 58 num. 1 y 2 CPP'
                },
                menosGrave: {
                    summary: 'Juzgado de Letras de lo Penal o Juzgado de Paz a Prevención',
                    description: 'Juzgado de Letras de lo Penal competente, o Juzgado de Paz actuando a prevención en municipios donde no exista Juez de Letras.',

            },
            {
                id: 'peticion_mp',
                criterion: '4. Petición del Ministerio Público',
                icon: 'fa-user-shield',

                    articles: 'Arts. 28, 36, 45, 173, 292 CPP'
                }
            },
            {
                id: 'peticion_defensa',
                criterion: '5. Petición de la Defensa Técnica',
                icon: 'fa-scale-balanced',

                grave: {

                    summary: 'AUDIENCIA INICIAL en el plazo estricto de HASTA SEIS (6) DÍAS',
                    description: 'Plazo legal perentorio e improrrogable contado a partir de la fecha en que se decreta la Detención Judicial.',

                menosGrave: {
                    summary: 'AUDIENCIA INICIAL en el plazo de HASTA SESENTA (60) DÍAS',

            { name: 'Asesinato', severity: 'grave', penalty: '20 a 25 años o Prisión de por Vida', description: 'Atentar contra la vida con alevosía o ensañamiento.', typicalMeasure: 'Prisión Preventiva / Detención Judicial', nextHearingDays: '6 días' },
            { name: 'Extorsión', severity: 'grave', penalty: '10 a 15 años de prisión + Multa', description: 'Obligar con violencia/intimidación a realizar u omitir un acto patrimonial.', typicalMeasure: 'Prisión Preventiva (Jurisdicción Nacional)', nextHearingDays: '6 días' },
            { name: 'Robo con Violencia Agravado', severity: 'grave', penalty: '6 a 9 años de prisión', description: 'Apoderamiento ilegítimo de bien mueble empleando violencia o intimidación.', typicalMeasure: 'Detención Judicial / Prisión Preventiva', nextHearingDays: '6 días' },
            { name: 'Tráfico de Drogas a Gran Escala', severity: 'grave', penalty: '7 a 10 años de prisión', description: 'Posesión y transporte no autorizado de estupefacientes a gran escala.', typicalMeasure: 'Prisión Preventiva', nextHearingDays: '6 días' },
            { name: 'Hurto Simple', severity: 'menos_grave', penalty: '1 a 3 años de prisión / Trabajo Comunitario', description: 'Apoderamiento de cosa mueble ajena sin violencia ni fuerza en las cosas.', typicalMeasure: 'Medidas Sustitutivas (Art. 173 CPP)', nextHearingDays: '60 días' },
            { name: 'Lesiones Leves / Menos Graves', severity: 'menos_grave', penalty: '1 a 3 años de prisión o Multa', description: 'Causar daño a la integridad física o salud que requiere asistencia médica.', typicalMeasure: 'Medidas Sustitutivas / Conciliación', nextHearingDays: '60 días' },
            { name: 'Amenazas Simples', severity: 'menos_grave', penalty: '6 meses a 2 años o Multa', description: 'Anunciar a otro la causación de un mal constitutivo o no de delito.', typicalMeasure: 'Medidas Sustitutivas / Conciliación', nextHearingDays: '60 días' },
            { name: 'Daños a la Propiedad', severity: 'menos_grave', penalty: 'Multa o 1 a 3 años de prisión', description: 'Destruir, inutilizar o deteriorar un bien ajeno.', typicalMeasure: 'Medidas Sustitutivas / Conciliación', nextHearingDays: '60 días' },
            { name: 'Estafa de Menor Cuantía', severity: 'menos_grave', penalty: '1 a 4 años de prisión', description: 'Engaño bastante para inducir a error y causar perjuicio patrimonial.', typicalMeasure: 'Medidas Sustitutivas / Acuerdo de Reparación', nextHearingDays: '60 días' }
        ];

        // Quiz Questions Data
        const QUIZ_QUESTIONS = [
            {
                question: "¿Cuál es el plazo legal máximo para celebrar la Audiencia Inicial si al imputado se le decretó Detención Judicial por un delito grave?",
                options: ["Dentro de los 3 días hábiles", "Dentro de los 6 días siguientes", "Dentro de los 30 días calendarios", "Dentro de los 60 días calendarios"],
                correctIndex: 1,
                explanation: "Conforme al Artículo 292 del CPP de Honduras, cuando el imputado queda privado de libertad cautelarmente, la Audiencia Inicial debe realizarse dentro de los 6 días siguientes a la emisión del auto."
            },
            {
                question: "En una Audiencia de Declaración de Imputado por un delito menos grave con pena no mayor de 5 años, ¿cuál es el plazo máximo para la Audiencia Inicial?",
                options: ["Hasta 6 días", "Hasta 15 días", "Hasta 60 días", "Hasta 90 días"],
                correctIndex: 2,
                explanation: "El Art. 292 del CPP establece que si el imputado goza de medidas sustitutivas o libertad, la Audiencia Inicial se señalará dentro de un plazo no mayor de 60 días calendarios."
            },
            {
                question: "¿Qué tipo de medida cautelar es la regla general en la Declaración de Imputado para un delito grave como el Homicidio o la Extorsión?",
                options: ["Conciliación inmediata", "Presentación periódica cada 15 días", "Detención Judicial / Prisión Preventiva (Art. 178 CPP)", "Caución económica únicamente"],
                correctIndex: 2,
                explanation: "En delitos graves (pena mayor de 5 años), el Ministerio Público solicita la Detención Judicial o Prisión Preventiva fundado en el peligro de fuga u obstaculización (Art. 178 CPP)."
            },
            {
                question: "¿Puede un Juez de Paz celebrar una Audiencia de Declaración de Imputado en materia penal?",
                options: [
                    "No, bajo ninguna circunstancia.",
                    "Sí, actuando a prevención en municipios donde no exista Juzgado de Letras.",
                    "Sí, pero solo si la pena es mayor de 20 años.",
                    "Únicamente con autorización previa de la Corte Suprema."
                ],
                correctIndex: 1,
                explanation: "El Artículo 59 numeral 1 del CPP otorga competencia a los Jueces de Paz para conocer requerimientos y actuaciones urgentes a prevención cuando no sea posible lograr la intervención del Juez de Letras."
            },
            {
                question: "¿Qué salida alternativa puede ser promovida por la defensa en la Declaración de Imputado por un delito menos grave patrimonial?",

                correctIndex: 1,
                explanation: "En delitos menos graves o que admiten la suspensión de la persecución, procede la Conciliación (Art. 45 CPP) para reparar el daño y extinguir la acción penal."
            }

        // Main App Component
        function App() {

            const [selectedCategory, setSelectedCategory] = useState('all');

            // Simulator State

            const [simCustomPenalty, setSimCustomPenalty] = useState(10);
            const [simCustomType, setSimCustomType] = useState('preset'); // 'preset' or 'custom'

            // Quiz State
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);

            // Filtered comparison items
            const filteredData = useMemo(() => {
                return COMPARISON_DATA.filter(item => {
                    const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
                    const q = searchQuery.toLowerCase();
                    const matchesSearch = item.criterion.toLowerCase().includes(q) ||
                                          item.grave.summary.toLowerCase().includes(q) ||
                                          item.menosGrave.summary.toLowerCase().includes(q) ||
                                          item.grave.articles.toLowerCase().includes(q) ||
                                          item.menosGrave.articles.toLowerCase().includes(q);
                    return matchesCategory && matchesSearch;
                });
            }, [searchQuery, selectedCategory]);

            // Quiz handlers
            const handleQuizSelect = (qIdx, oIdx) => {
                if (quizSubmitted) return;
                setQuizAnswers(prev => ({ ...prev, [qIdx]: oIdx }));
            };

            const calculateQuizScore = () => {
                let score = 0;
                QUIZ_QUESTIONS.forEach((q, idx) => {
                    if (quizAnswers[idx] === q.correctIndex) score++;
                });
                return score;
            };

            const resetQuiz = () => {
                setQuizAnswers({});
                setQuizSubmitted(false);
            };

                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div>
                                    <div className="flex items-center gap-3 mb-1">
                                        <span className="bg-blue-600 text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md text-white shadow-sm">

                                        title="Imprimir o Guardar PDF"
                                    >
                                        <i className="fa-solid fa-print"></i>
                                        <span>Imprimir / PDF</span>
                                    </button>
                                </div>
                            </div>

                            {/* Main Navigation Tabs */}
                            <nav className="flex space-x-1 sm:space-x-2 mt-6 border-b border-slate-800 overflow-x-auto custom-scrollbar pb-1">
                                <button

                                    className={`px-4 py-2.5 rounded-t-lg font-semibold text-sm transition flex items-center gap-2 whitespace-nowrap ${
                                        activeTab === 'matrix'
                                            ? 'bg-slate-800 text-blue-400 border-b-2 border-blue-500 shadow'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'

                                >
                                    <i className="fa-solid fa-table-columns"></i>
                                    Cuadro Comparativo
                                </button>

                                <button
                                    onClick={() => setActiveTab('simulator')}
                                    className={`px-4 py-2.5 rounded-t-lg font-semibold text-sm transition flex items-center gap-2 whitespace-nowrap ${
                                        activeTab === 'simulator'
                                            ? 'bg-slate-800 text-blue-400 border-b-2 border-blue-500 shadow'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'

                                    <i className="fa-solid fa-calculator"></i>
                                    Evaluador Práctico / Casos
                                </button>

                                        activeTab === 'flowchart'
                                            ? 'bg-slate-800 text-blue-400 border-b-2 border-blue-500 shadow'
                                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                                    }`}
                                >
                                    <i className="fa-solid fa-diagram-project"></i>
                                    Línea de Tiempo (Plazos)
                                </button>

                                <button
                                    onClick={() => setActiveTab('quiz')}
                                    className={`px-4 py-2.5 rounded-t-lg font-semibold text-sm transition flex items-center gap-2 whitespace-nowrap ${
                                        activeTab === 'quiz'

                                >
                                    <i className="fa-solid fa-graduation-cap"></i>
                                    Autoevaluación
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 print-full">

                        {/* TAB 1: COMPARATIVE MATRIX */}
                        {activeTab === 'matrix' && (
                            <div className="space-y-6">
                                {/* Search & Category Filters */}
                                <div className="bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between no-print">
                                    <div className="relative w-full md:w-96">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                        <input
                                            type="text"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Buscar por palabra clave, artículo o criterio..."
                                            className="w-full pl-10 pr-4 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        />
                                        {searchQuery && (
                                            <button 
                                                onClick={() => setSearchQuery('')}
                                                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs"

                                        <button
                                            onClick={() => setSelectedCategory('all')}

                                                            else if (isSelected) btnStyle = "bg-red-100 border-red-500 text-red-900";
                                                        } else if (isSelected) {
                                                            btnStyle = "bg-blue-50 border-blue-600 text-blue-900 font-semibold ring-1 ring-blue-600";
                                                        }

                                                        return (
                                                            <button
                                                                key={oIdx}
                                                                onClick={() => handleQuizSelect(qIdx, oIdx)}
                                                                disabled={quizSubmitted}
                                                                className={`w-full text-left p-3 rounded-lg border text-xs transition flex items-center justify-between ${btnStyle}`}
                                                            >
                                                                <span>{opt}</span>
                                                                {quizSubmitted && isCorrect && (
                                                                    <i className="fa-solid fa-circle-check text-emerald-600 text-base"></i>
                                                                )}
                                                                {quizSubmitted && isSelected && !isCorrect && (
                                                                    <i className="fa-solid fa-circle-xmark text-red-600 text-base"></i>
                                                                )}
                                                            </button>
                                                        );
                                                    })}
                                                </div>

                                                {quizSubmitted && (
                                                    <div className="mt-3 p-3 bg-blue-50 border border-blue-200 rounded text-xs text-blue-900">
                                                        <strong>Explicación Legal:</strong> {q.explanation}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-6 flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
                                        {!quizSubmitted ? (
                                            <button
                                                onClick={() => setQuizSubmitted(true)}
                                                disabled={Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length}
                                                className={`px-6 py-2.5 rounded-lg text-sm font-bold text-white shadow transition ${
                                                    Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length
                                                        ? 'bg-slate-400 cursor-not-allowed'
                                                        : 'bg-blue-600 hover:bg-blue-700'
                                                }`}
                                            >
                                                Calificar Respuestas
                                            </button>
                                        ) : (
                                            <button
                                                onClick={resetQuiz}
                                                className="px-6 py-2.5 rounded-lg text-sm font-bold bg-slate-900 text-white hover:bg-slate-800 transition"
                                            >
                                                Reintentar Cuestionario
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* DETAIL MODAL FOR DEEP ANALYSIS */}
                    {selectedItemDetail && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-6">
                                <div className="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
                                    <div className="flex items-center gap-2">
                                        <span className="p-2 bg-slate-900 text-white rounded-lg text-sm">
                                            <i className={`fa-solid ${selectedItemDetail.icon}`}></i>
                                        </span>
                                        <h3 className="font-extrabold text-slate-900 text-lg">
                                            {selectedItemDetail.criterion}
                                        </h3>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedItemDetail(null)}
                                        className="text-slate-400 hover:text-slate-600 p-1"
                                    >
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {/* Delito Grave Detailed Card */}
                                    <div className="bg-red-50 p-4 rounded-lg border border-red-200">
                                        <span className="text-xs font-bold text-red-700 uppercase tracking-wider block mb-1">
                                            Análisis para Delitos Graves
                                        </span>
                                        <h4 className="font-bold text-slate-900 text-sm">
                                            {selectedItemDetail.grave.summary}
                                        </h4>
                                        <p className="text-xs text-slate-700 mt-2 leading-relaxed">
                                            {selectedItemDetail.grave.details}
                                        </p>
                                        <div className="mt-3 pt-2 border-t border-red-200/60 text-xs text-red-900 font-mono">
                                            Base Legal: {selectedItemDetail.grave.articles}
                                        </div>
                                    </div>

                                    {/* Delito Menos Grave Detailed Card */}
                                    <div className="bg-emerald-50 p-4 rounded-lg border border-emerald-200">
                                        <span className="text-xs font-bold text-emerald-700 uppercase tracking-wider block mb-1">
                                            Análisis para Delitos Menos Graves
                                        </span>
                                        <h4 className="font-bold text-slate-900 text-sm">
                                            {selectedItemDetail.menosGrave.summary}
                                        </h4>
                                        <p className="text-xs text-slate-700 mt-2 leading-relaxed">
                                            {selectedItemDetail.menosGrave.details}
                                        </p>
                                        <div className="mt-3 pt-2 border-t border-emerald-200/60 text-xs text-emerald-900 font-mono">
                                            Base Legal: {selectedItemDetail.menosGrave.articles}
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-6 text-right">
                                    <button
                                        onClick={() => setSelectedItemDetail(null)}
                                        className="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800"
                                    >
                                        Cerrar Análisis
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 py-6 text-center text-xs no-print">
                        <div className="max-w-7xl mx-auto px-4">
                            <p>© Código Procesal Penal de Honduras (Decreto No. 9-99-E) y Código Penal (Decreto No. 130-2017)</p>
                            <p className="mt-1 text-slate-500">Herramienta interactiva de estudio comparativo y práctica legal para la Audiencia de Declaración de Imputado.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
